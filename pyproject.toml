[project]
name = "trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swd543", email = "swapneel.datta@rabobank.nl" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
trading = "trading:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]