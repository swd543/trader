[project]
name = "trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "swd543", email = "swapneel.datta@rabobank.nl" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "plotly>=6.7.0",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.57.0",
]

[project.scripts]
trading = "trading:main"
trading-app = "trading.streamlit_launcher:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
